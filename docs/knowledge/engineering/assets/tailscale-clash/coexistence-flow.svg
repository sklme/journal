<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Tailscale 与 Clash TUN 的工作分工</title>
  <desc id="desc">普通域名解析沿用系统和 Clash 的配置，Tailscale 不接受网络 DNS 配置。目的地址属于 Tailscale 的 IPv4 或 IPv6 网段时绕过 Clash TUN，其余互联网流量由 Clash 规则选择代理或直连。这是原理示意而非抓包结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b3a}
      .title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:16px;fill:#475569}
      .line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="720" rx="20" fill="#f5f8fb"/>
  <text x="40" y="54" class="title">让 DNS 与目的地址路由各有明确范围</text>
  <text x="40" y="86" class="small">前提：Tailscale 已连接；Clash TUN 保持开启；设备间组网场景</text>

  <rect x="32" y="110" width="1056" height="192" rx="14" fill="#fff" stroke="#d9e2ec"/>
  <text x="56" y="144" class="head">① 域名解析：沿用已经工作的解析配置</text>
  <rect x="58" y="166" width="235" height="98" rx="10" fill="#edf2f7"/>
  <text x="82" y="200" class="head">应用查询域名</text>
  <text x="82" y="233" class="body">使用系统解析流程时</text>
  <path d="M294 216H353" class="line"/>
  <rect x="365" y="166" width="311" height="98" rx="10" fill="#e6f4ef"/>
  <text x="389" y="200" class="head">系统 / Clash DNS</text>
  <text x="389" y="233" class="body">按现有配置解析与映射</text>
  <rect x="718" y="166" width="337" height="98" rx="10" fill="#fff7e8" stroke="#e7cfa0"/>
  <text x="742" y="199" class="head">Tailscale DNS 接受：关闭</text>
  <text x="742" y="232" class="body">减少另一套 DNS 配置的介入</text>

  <rect x="32" y="326" width="1056" height="300" rx="14" fill="#fff" stroke="#d9e2ec"/>
  <text x="56" y="362" class="head">② IP 流量：按目的地址划分处理范围</text>
  <rect x="58" y="427" width="230" height="114" rx="10" fill="#edf2f7"/>
  <text x="82" y="465" class="head">应用建立连接</text>
  <text x="82" y="500" class="body">系统按目的地址选路</text>
  <path d="M289 480H322V413H358" class="line"/>
  <path d="M322 480V552H358" class="line"/>
  <rect x="370" y="385" width="330" height="100" rx="10" fill="#e5efff"/>
  <text x="390" y="415" class="head">Tailscale 网段：排除 TUN</text>
  <text x="390" y="444" class="body">100.64.0.0/10</text>
  <text x="390" y="471" class="body">fd7a:115c:a1e0::/48</text>
  <path d="M702 435H748" class="line"/>
  <rect x="760" y="385" width="295" height="100" rx="10" fill="#e5efff"/>
  <text x="782" y="421" class="head">Tailscale 路径</text>
  <text x="782" y="458" class="body">加密连接 tailnet 设备</text>
  <rect x="370" y="512" width="330" height="88" rx="10" fill="#e6f4ef"/>
  <text x="390" y="546" class="head">其余互联网流量</text>
  <text x="390" y="577" class="body">继续由 Clash TUN 接收</text>
  <path d="M702 556H748" class="line"/>
  <rect x="760" y="512" width="295" height="88" rx="10" fill="#e6f4ef"/>
  <text x="782" y="546" class="head">Mihomo 规则分流</text>
  <text x="782" y="577" class="body">选择代理或直连</text>

  <text x="40" y="659" class="small">路由排除针对内部目的地址；Tailscale 的公网协调、直连与中继通信仍受现有联网配置影响。</text>
  <text x="40" y="689" class="small">示意图用于解释配置分工，不表示本次已经逐包确认了所有应用的解析与通信路径。</text>
</svg>
